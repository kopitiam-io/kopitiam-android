<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --jade:#1f6f5c; --jade-dark:#144e40;
    --whitewash:#f4f1e9; --stone-400:#b6afa0; --ink:#20211c; --muted:#6f6d62;
    --nyonya-a:#1f6f5c; --nyonya-b:#c68f52; --nyonya-bg:#f4f1e9;
  }
  html,body{margin:0;padding:0}
  #stage{
    width:1024px; height:500px; position:relative; overflow:hidden;
    background:var(--whitewash);
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  }
  .serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;}

  /* Nyonya-tile band — same checkered accent as the site/Reddit assets */
  .nyonya{
    position:absolute; left:0; right:0; height:56px;
    background-color:var(--nyonya-bg);
    background-image:
      radial-gradient(circle at 50% 50%, var(--nyonya-a) 0 7px, transparent 8px),
      linear-gradient(45deg, transparent 46%, var(--nyonya-b) 46% 54%, transparent 54%),
      linear-gradient(-45deg, transparent 46%, var(--nyonya-b) 46% 54%, transparent 54%);
    background-size:56px 56px;
    border-bottom:3px solid var(--jade-dark);
    opacity:0.95;
  }
  .nyonya.top{ top:0; }
  .nyonya.bottom{ bottom:0; border-bottom:none; border-top:3px solid var(--jade-dark); }

  .content{
    position:absolute; left:0; right:0; top:56px; bottom:56px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 48px;
  }
  .eyebrow{
    display:inline-block; font-size:17px; font-weight:700; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--jade);
    padding-bottom:7px; border-bottom:3px solid var(--jade); margin-bottom:18px;
  }
  .hero{
    font-weight:800; font-size:76px; line-height:0.9; letter-spacing:-0.01em;
    color:var(--ink); margin:0; display:flex; align-items:center; gap:22px;
  }
  .hero .muted{ color:var(--stone-400); }
  .lede{
    font-size:21px; color:var(--muted); line-height:1.4; margin:20px 0 0; max-width:840px;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="nyonya top"></div>
  <div class="content">
    <span class="eyebrow">100% free · no sign-up</span>
    <h1 class="serif hero">
      <svg class="cup" width="76" height="76" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="translate(6,6)">
          <path fill="#1f6f5c" d="M18,40 h40 v13 a16,16 0 0 1 -16,16 h-8 a16,16 0 0 1 -16,-16 z"/>
          <path stroke="#1f6f5c" stroke-width="6" stroke-linecap="round" fill="none" d="M58,44 a10,10 0 0 1 0,19"/>
          <path fill="#1f6f5c" d="M15,73 h46 a3,3 0 0 1 0,6 h-46 a3,3 0 0 1 0,-6 z"/>
          <path stroke="#c68f52" stroke-width="5" stroke-linecap="round" fill="none" d="M31,34 q6,-6 0,-12 q-6,-6 0,-12 M47,34 q6,-6 0,-12 q-6,-6 0,-12"/>
        </g>
      </svg>
      <span>Kopitiam</span>
    </h1>
    <p class="lede">Every PDF tool, free — edit, scan, OCR, convert, merge &amp; redact, right in your browser.</p>
  </div>
  <div class="nyonya bottom"></div>
</div>
</body>
</html>
